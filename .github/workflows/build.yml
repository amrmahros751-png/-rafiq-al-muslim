name: Build AAB

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Cordova
        run: npm install -g cordova
      - name: Create Cordova Project
        run: |
          cordova create myApp com.rafiq.almuslim "رفيق المسلم" --no-telemetry || true
          rm -rf myApp/www/*
          cp -r www/* myApp/www/
          cp config.xml myApp/ || echo "no config"
          cd myApp
          cordova platform add android
          cordova build android --release -- --packageType=bundle
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: myApp/platforms/android/app/build/outputs/bundle/release/*.aab
