name: Build Signed AAB
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      
      - run: npm install
      - run: npx cap add android || true
      - run: npx cap copy android

      - name: Build AAB (unsigned)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: SIGN AAB with jarsigner
        run: |
          keytool -genkey -v -keystore /tmp/mykey.jks -alias myalias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=MyApp"
          AAB=$(find android/app/build/outputs -name "*.aab" | head -n 1)
          echo "Signing $AAB"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore /tmp/mykey.jks -storepass 123456 -keypass 123456 $AAB myalias
          jarsigner -verify $AAB

      - name: Upload SIGNED AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-SIGNED
          path: android/app/build/outputs/bundle/release/*.aab
